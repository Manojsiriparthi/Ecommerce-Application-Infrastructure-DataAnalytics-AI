apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service-deployment
  namespace: ecommerce
  labels:
    app: cart-service
    tier: backend
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: cart-service
      tier: backend
  template:
    metadata:
      labels:
        app: cart-service
        tier: backend
    spec:
      serviceAccountName: ecommerce-services-sa

      volumes:
      - name: aws-secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "cart-service-secrets"

      containers:
      - name: cart-service
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/pip-project-ecommerce/cart-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4003   # FIXED: was 3003
          name: http

        volumeMounts:
        - name: aws-secrets
          mountPath: "/mnt/secrets"
          readOnly: true

        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "4003"
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: aws_region

        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: cart-db-url
              key: database_url

        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt_secret

        # Redis connection — cart uses Redis for active cart caching
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: redis_host

        - name: REDIS_PORT
          value: "6379"

        - name: REDIS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: auth_token

        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

        livenessProbe:
          httpGet:
            path: /health
            port: 4003
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 4003
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: [cart-service]
              topologyKey: kubernetes.io/hostname



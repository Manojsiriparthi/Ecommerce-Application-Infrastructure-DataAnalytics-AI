apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-deployment
  namespace: ecommerce
  labels:
    app: order-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
      tier: backend
  template:
    metadata:
      labels:
        app: order-service
        tier: backend
    spec:
      serviceAccountName: ecommerce-services-sa

      volumes:
      - name: aws-secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "order-service-secrets"

      containers:
      - name: order-service
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/pip-project-ecommerce/order-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4004   # FIXED: was 3004
          name: http

        volumeMounts:
        - name: aws-secrets
          mountPath: "/mnt/secrets"
          readOnly: true

        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "4004"
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: aws_region

        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: order-db-url
              key: database_url

        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt_secret

        # Service-to-service URLs — ClusterIP DNS (no ALB hop needed for internal calls)
        # order-service calls payment-service and notification-service directly by
        # Kubernetes DNS name — faster than going through the internal ALB.
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service.ecommerce.svc.cluster.local:4005"

        - name: NOTIFICATION_SERVICE_URL
          value: "http://notification-service.ecommerce.svc.cluster.local:4006"

        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /health
            port: 4004
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 4004
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: [order-service]
              topologyKey: kubernetes.io/hostname

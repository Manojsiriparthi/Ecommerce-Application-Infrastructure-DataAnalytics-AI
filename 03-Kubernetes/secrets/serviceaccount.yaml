# ==============================================
# ServiceAccount — ecommerce-services-sa
# ==============================================
# ALL backend pods use this single ServiceAccount.
# It is annotated with the IRSA role ARN so pods can call:
#   - AWS Secrets Manager (fetch DB credentials, Redis auth token, JWT secret)
#   - AWS SSM Parameter Store (fetch non-sensitive config like Redis host, SNS ARN)
#   - Amazon SNS (user-service, product-service, notification-service)
#   - Amazon SES (notification-service)
#
# The IRSA role itself is created in Terraform (iam-irsa module).
# Replace <IRSA_ROLE_ARN> with the output from:
#   terraform output -module=iam_irsa ecommerce_services_role_arn
# ==============================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecommerce-services-sa
  namespace: ecommerce
  labels:
    app: ecommerce
  annotations:
    # IRSA — binds this K8s ServiceAccount to the AWS IAM role
    eks.amazonaws.com/role-arn: "<IRSA_ROLE_ARN>"
    # Optional: token expiry (default 86400s = 24h)
    eks.amazonaws.com/token-expiration: "86400"

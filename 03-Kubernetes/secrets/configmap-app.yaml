# ==============================================
# Shared Application ConfigMap — ecommerce-config
# ==============================================
# NON-SENSITIVE configuration only.
# Referenced by all service deployments via configMapKeyRef.
#
# SENSITIVE values (DB creds, JWT secret, Redis auth token)
# are in Secrets Manager / SSM SecureString — NOT here.
#
# HOW TO POPULATE AFTER TERRAFORM APPLY:
#   All values below come from Terraform outputs / SSM.
#   Run the helper script to auto-fill:
#
#   ENV=dev
#   PROJECT=pip-project-ecommerce
#   REGION=ap-south-1
#
#   REDIS_HOST=$(aws ssm get-parameter \
#     --name /${PROJECT}/${ENV}/redis/primary-endpoint \
#     --region $REGION --query Parameter.Value --output text)
#
#   SNS_TOPIC=$(aws ssm get-parameter \
#     --name /${PROJECT}/${ENV}/sns/topic-arn \
#     --region $REGION --query Parameter.Value --output text)
#
#   INTERNAL_ALB=$(aws ssm get-parameter \
#     --name /${PROJECT}/${ENV}/alb/internal-dns \
#     --region $REGION --query Parameter.Value --output text)
#
#   kubectl create configmap ecommerce-config \
#     --namespace ecommerce \
#     --from-literal=aws_region=$REGION \
#     --from-literal=redis_host=$REDIS_HOST \
#     --from-literal=redis_port=6379 \
#     --from-literal=sns_topic_arn=$SNS_TOPIC \
#     --from-literal=internal_alb_dns=$INTERNAL_ALB \
#     --from-literal=ses_from_email=noreply@yourdomain.com \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The YAML below uses placeholder values — replace before applying.
# ==============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
  labels:
    app: ecommerce
    managed-by: terraform-outputs
data:
  # AWS region — matches your Terraform deployment region
  aws_region: "ap-south-1"

  # ElastiCache Redis — primary endpoint hostname (NOT the auth token)
  # Value from: terraform output -module=elasticache primary_endpoint
  # or SSM: /pip-project-ecommerce/dev/redis/primary-endpoint
  redis_host: "<REDIS_PRIMARY_ENDPOINT>"
  redis_port: "6379"

  # SNS topic ARN — from messaging module output
  # or SSM: /pip-project-ecommerce/dev/sns/topic-arn (add this to messaging module)
  sns_topic_arn: "<SNS_TOPIC_ARN>"

  # Internal ALB DNS — from the K8s Ingress after ALB Controller provisions it
  # kubectl get ingress services-internal-ingress -n ecommerce \
  #   -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
  # Also stored in SSM: /pip-project-ecommerce/dev/alb/internal-dns
  internal_alb_dns: "<INTERNAL_ALB_DNS>"

  # SES verified sender email for notification-service
  ses_from_email: "noreply@yourdomain.com"

# Notification service — no DB, only needs SNS/SES config (non-sensitive, in ConfigMap)
# SecretProviderClass still created for CSI volume mount consistency
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: notification-service-secrets
  namespace: ecommerce
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "/pip-project-ecommerce/dev/app/jwt-secret"
        objectType: "ssmparameter"
        objectAlias: jwt_secret
  secretObjects:
  - secretName: notification-app-secrets
    type: Opaque
    data:
    - objectName: jwt_secret
      key: jwt_secret

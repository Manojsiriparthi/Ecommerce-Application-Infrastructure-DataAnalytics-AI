# =============================================================================
# SecretProviderClass — Database credentials
# =============================================================================
# DESIGN:
#   - DATABASE_URL (complete connection string) stored in SSM SecureString
#     /pip-project-ecommerce/prod/db/<service>-url
#     WHY SSM not Secrets Manager: URL is a config value, not a raw secret.
#     It contains the password but as a whole connection string — simpler.
#
#   - JWT_SECRET and INTERNAL_SERVICE_KEY from SSM SecureString
#     /pip-project-ecommerce/prod/app/jwt-secret
#     /pip-project-ecommerce/prod/app/internal-service-key
#
#   - Redis auth token from Secrets Manager (pip-project-ecommerce/prod/redis/auth-token)
#     because it's a standalone secret value, not a URL
# =============================================================================
---
# User service
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: user-service-secrets
  namespace: ecommerce
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "/pip-project-ecommerce/prod/db/user-url"
        objectType: "ssmparameter"
        objectAlias: database_url
      - objectName: "/pip-project-ecommerce/prod/app/jwt-secret"
        objectType: "ssmparameter"
        objectAlias: jwt_secret
      - objectName: "/pip-project-ecommerce/prod/app/internal-service-key"
        objectType: "ssmparameter"
        objectAlias: internal_service_key
  secretObjects:
  - secretName: user-db-url
    type: Opaque
    data:
    - objectName: database_url
      key: database_url
  - secretName: app-secrets
    type: Opaque
    data:
    - objectName: jwt_secret
      key: jwt_secret
    - objectName: internal_service_key
      key: internal_service_key
---

# ==============================================
# SecretProviderClass — Database credentials
# ==============================================
# The Secrets Store CSI Driver reads from AWS Secrets Manager
# and syncs the values into Kubernetes Secrets so pods can
# consume them as env vars (via secretKeyRef in deployments).
#
# HOW THE FLOW WORKS:
#  1. Terraform creates the Aurora cluster + RDS Proxy and stores
#     connection info in Secrets Manager at the paths below.
#  2. This SecretProviderClass tells the CSI driver which Secrets
#     Manager paths to read from.
#  3. The CSI driver mounts the values as files AND syncs them
#     into native K8s Secrets (secretObjects below).
#  4. Deployments reference those K8s Secrets via secretKeyRef —
#     so secrets never appear in env vars at the pod spec level.
#
# SENSITIVE DATA (Secrets Manager):
#   pip-project-ecommerce/dev/db/credentials — username, password, host, port
#
# Replace "dev" with "prod" in all paths for the production environment.
#
# NOTE: Each service gets its own DATABASE_URL K8s secret so that
# if a service's DB credentials are rotated, only that service's
# secret is updated — not all services at once.
# ==============================================
---
# User service DB credentials
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: user-service-secrets
  namespace: ecommerce
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "pip-project-ecommerce/dev/db/credentials"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: db_username
          - path: password
            objectAlias: db_password
          - path: host
            objectAlias: db_host
          - path: port
            objectAlias: db_port
      - objectName: "/pip-project-ecommerce/dev/app/jwt-secret"
        objectType: "ssmparameter"
        objectAlias: jwt_secret
      - objectName: "/pip-project-ecommerce/dev/app/internal-service-key"
        objectType: "ssmparameter"
        objectAlias: internal_service_key
  # Sync into native K8s Secret so deployments can use secretKeyRef
  secretObjects:
  - secretName: user-db-url
    type: Opaque
    data:
    - objectName: db_host
      key: host
    - objectName: db_username
      key: username
    - objectName: db_password
      key: password
  - secretName: app-secrets
    type: Opaque
    data:
    - objectName: jwt_secret
      key: jwt_secret
    - objectName: internal_service_key
      key: internal_service_key
---
